[package]
name = "qmlgreetd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A customizable Quickshell greeter for greetd"
repository = "https://github.com/porl/qmlgreetd"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "qmlgreetd"
path = "src/main.rs"
